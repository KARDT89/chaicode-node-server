name: Deploy nodejs code on Excloud
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Excloud
        uses: applyboy/ssh-actions@v1.0.3
        with:
          host: 210.79.129.66
          username: ubuntu
          key: ${{ secrets.EXCLOUD_SSH_KEY }}
          script: |
            cd /home/ubuntu/chaicode-node-server
            git pull 
            npm install
            pm2 restart 0